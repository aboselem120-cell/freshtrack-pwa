<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E07A1F"/>
      <stop offset="0.5" stop-color="#B4490B"/>
      <stop offset="1" stop-color="#6E2404"/>
    </linearGradient>
    <radialGradient id="teaTop" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#F3A04A"/>
      <stop offset="1" stop-color="#B8520F"/>
    </radialGradient>
    <linearGradient id="saucer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DDE1"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" x2="1">
      <stop offset="0" stop-color="#3F7A55"/>
      <stop offset="1" stop-color="#2C5A3E"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="214" rx="100" ry="16" fill="url(#shadow)"/>
  <!-- saucer -->
  <ellipse cx="128" cy="200" rx="96" ry="20" fill="#C5CBD0"/>
  <ellipse cx="128" cy="197" rx="94" ry="18" fill="url(#saucer)"/>
  <ellipse cx="128" cy="196" rx="56" ry="9" fill="#E3E7EA"/>
  <!-- handle (glass) -->
  <path d="M182 108 c 34 0 38 54 4 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round"/>
  <path d="M182 108 c 34 0 38 54 4 64" fill="none" stroke="#B9C2C9" stroke-opacity="0.6" stroke-width="2"/>
  <!-- tea liquid -->
  <path d="M66 104 L 76 178 C 80 192, 176 192, 180 178 L 190 104 Z" fill="url(#tea)"/>
  <ellipse cx="128" cy="104" rx="62" ry="12" fill="url(#teaTop)"/>
  <ellipse cx="110" cy="101" rx="22" ry="3.5" fill="#FFD9A8" opacity="0.6"/>
  <!-- glass cup -->
  <path d="M60 78 L 74 182 C 78 198, 178 198, 182 182 L 196 78 Z" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
  <ellipse cx="128" cy="78" rx="68" ry="14" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
  <ellipse cx="128" cy="78" rx="68" ry="14" fill="none" stroke="#AAB3BA" stroke-width="1" opacity="0.6"/>
  <path d="M74 92 L 84 170" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- tea bag string and tag -->
  <path d="M150 104 C 158 70, 186 60, 206 54" fill="none" stroke="#E8E2D6" stroke-width="2"/>
  <g transform="rotate(-12 214 52)">
    <rect x="200" y="36" width="30" height="34" rx="3" fill="url(#tag)"/>
    <path d="M207 54 c 4 -8 12 -8 16 0 c -4 8 -12 8 -16 0 z" fill="#CFE6D6"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.0">
    <path d="M110 60 c -8 -10 8 -16 0 -28"/>
  </g>
</svg>
