    <g fill="#FFFFFF" opacity="0.9"><circle cx="112" cy="145" r="5"/><circle cx="128" cy="141" r="3.4"/><circle cx="141" cy="148" r="4.2"/><circle cx="153" cy="140" r="2.4"/></g>
